<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة متجر لمسة</title><style>
:root{--gold:#c9a45c;--bg:#090909;--panel:#171717;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1e8;font-family:Arial,Tahoma,sans-serif}header{padding:22px 16px;border-bottom:1px solid #4c3b20;text-align:center}h1{color:var(--gold);margin:0 0 6px;font-size:25px}p{color:var(--muted);line-height:1.7}.wrap{max-width:1000px;margin:24px auto;padding:0 14px}.panel{background:var(--panel);border:1px solid #40331e;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:12px 0;color:var(--gold)}input,textarea{width:100%;margin-top:7px;padding:12px;border-radius:8px;border:1px solid #51452f;background:#0d0d0d;color:white;font:inherit}textarea{min-height:340px;direction:ltr;text-align:left;font-family:monospace}.btn{background:var(--gold);border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;color:#17120a;margin:5px}.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}.hidden{display:none!important}.status{color:var(--gold);white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{background:#101010;border:1px solid #40331e;border-radius:10px;padding:12px;overflow-wrap:anywhere}.item b{color:var(--gold)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.small{font-size:12px;color:#aaa}
</style></head><body><header><h1>متجر لمسة للأقمشة الرجالية</h1><div>لوحة الإدارة المستقلة</div></header><main class="wrap"><section id="login" class="panel"><h2>تسجيل دخول الإدارة</h2><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><label>رمز التأكيد<input id="code" inputmode="numeric"></label><button class="btn" id="signIn">دخول</button><div class="status" id="loginStatus"></div></section>
<section id="dashboard" class="hidden"><div class="panel top"><div><h2>إدارة المتجر</h2><p>التغييرات تحفظ في قاعدة بيانات متجر العملاء وتظهر تلقائيًا عند تحديث بيانات المتجر.</p></div><button class="btn ghost" id="logout">تسجيل الخروج</button></div>
<div class="panel"><div class="top"><h3>المنتجات</h3><button class="btn" id="loadProducts">تحميل المنتجات</button></div><p>يمكنك تعديل قائمة المنتجات كاملة بصيغة JSON ثم حفظها. خذ نسخة احتياطية قبل أي تعديل.</p><div id="productsList" class="grid"></div><label>بيانات المنتجات (JSON)<textarea id="productsJson" spellcheck="false"></textarea></label><button class="btn" id="saveProducts">حفظ التعديلات في المتجر</button><button class="btn ghost" id="downloadProducts">تنزيل نسخة احتياطية</button><div id="productStatus" class="status"></div></div>
<div class="panel"><div class="top"><h3>طلبات العملاء</h3><button class="btn" id="loadOrders">تحميل الطلبات</button></div><div id="ordersList" class="grid"></div><div id="ordersStatus" class="status"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let products=[];
async function api(action,options={}){const r=await fetch('/.netlify/functions/manage?action='+action,{...options,headers:{...(options.headers||{}),'content-type':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر تنفيذ العملية');return d}
$('signIn').onclick=async()=>{ $('loginStatus').textContent='جارٍ التحقق…';try{const r=await fetch('/.netlify/functions/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,code:$('code').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تسجيل الدخول');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('password').value='';$('code').value='';await loadProducts()}catch(e){$('loginStatus').textContent=e.message}};
$('logout').onclick=async()=>{await fetch('/.netlify/functions/logout',{method:'POST'});$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
async function loadProducts(){ $('productStatus').textContent='جارٍ تحميل المنتجات…';try{const d=await api('products');products=Array.isArray(d.products)?d.products:[];$('productsJson').value=JSON.stringify(products,null,2);$('productsList').innerHTML=products.map((p,i)=>`<div class="item"><b>${i+1}. ${esc(p.name||'منتج بلا اسم')}</b><div>السعر: ${esc(p.price??'—')}</div><div>الكمية: ${esc(p.availableStock??p.stock??'—')}</div><div class="small">${esc(p.category||'')}</div></div>`).join('')||'<p>لا توجد منتجات منشورة بعد.</p>';$('productStatus').textContent=`تم تحميل ${products.length} منتج.`}catch(e){$('productStatus').textContent=e.message}}
$('loadProducts').onclick=loadProducts;$('saveProducts').onclick=async()=>{try{const list=JSON.parse($('productsJson').value);if(!Array.isArray(list))throw Error('يجب أن تكون البيانات قائمة منتجات.');if(!confirm('هل تريد حفظ القائمة واستبدال المنتجات المنشورة في المتجر؟'))return;$('productStatus').textContent='جارٍ الحفظ…';const d=await api('products',{method:'POST',body:JSON.stringify({products:list})});products=list;$('productStatus').textContent=`تم حفظ ${d.count} منتج. ستظهر التغييرات لزوار المتجر عند تحديث بيانات الصفحة.`;await loadProducts()}catch(e){$('productStatus').textContent=e.message}};
$('downloadProducts').onclick=()=>{const b=new Blob([$('productsJson').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lamsa-products-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('loadOrders').onclick=async()=>{ $('ordersStatus').textContent='جارٍ تحميل الطلبات…';try{const d=await api('orders');$('ordersList').innerHTML=(d.orders||[]).map(o=>`<div class="item"><b>طلب رقم ${esc(o.orderNumber||'—')}</b><div>الاسم: ${esc(o.name||'—')}</div><div>الهاتف: ${esc(o.phone||'—')}</div><div>المحافظة: ${esc(o.governorate||'—')} — ${esc(o.district||'')}</div><div>الإجمالي: ${esc(o.total??o.totalPrice??'—')}</div><div class="small">${esc(o.savedAt||'')}</div><details><summary>تفاصيل الطلب</summary><pre style="white-space:pre-wrap;direction:ltr">${esc(JSON.stringify(o.items||[],null,2))}</pre></details></div>`).join('')||'<p>لا توجد طلبات محفوظة.</p>';$('ordersStatus').textContent=`عدد الطلبات: ${d.count||0}`}catch(e){$('ordersStatus').textContent=e.message}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
